name: Render Deploy Hook

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Ensure CI succeeded (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER_REPO="${GITHUB_REPOSITORY}"
          BRANCH="${GITHUB_REF_NAME}"

          RESP=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER_REPO}/actions/workflows/ci.yaml/runs?branch=${BRANCH}&status=completed&per_page=1")

          CONCLUSION=$(python -c 'import json,sys; resp=json.loads(sys.argv[1]); runs=resp.get("workflow_runs") or []; run=runs[0] if runs else {}; print((run.get("conclusion") or ""))' "$RESP")

          if [ "${CONCLUSION}" != "success" ]; then
            echo "CI is not successful for branch '${BRANCH}' (conclusion='${CONCLUSION}'). Refusing to deploy." >&2
            exit 1
          fi

      - name: Trigger Render Deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing secret RENDER_DEPLOY_HOOK_URL" >&2
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
