name: CML

on:
  pull_request:
  workflow_dispatch:

jobs:
  pipeline-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Configure DVC auth (DagsHub)
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user "$DAGSHUB_USERNAME"
          dvc remote modify --local dagshub password "$DAGSHUB_TOKEN"

      - name: Pull data/model cache
        run: |
          dvc pull

      - name: Reproduce pipeline
        run: |
          dvc repro

      - name: Create CML report
        run: |
          echo "## DVC Pipeline Report" > report.md
          echo "" >> report.md
          echo "### Metrics" >> report.md
          echo "" >> report.md
          dvc metrics show --md >> report.md
          echo "" >> report.md
          echo "### Diff (metrics)" >> report.md
          echo "" >> report.md
          dvc metrics diff --md >> report.md || true

      - name: Setup CML
        uses: iterative/setup-cml@v2

      - name: Comment report to PR
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cml comment create report.md
